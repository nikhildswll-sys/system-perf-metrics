name: System Performance Benchmark

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [auto_ping, live_sync]

permissions:
  contents: write

jobs:
  benchmark-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Benchmark Core
        uses: actions/checkout@v4
        with:
          repository: 'nikhildswll-sys/bharat-job'
          token: ${{ secrets.WORKER_PAT }}
          fetch-depth: 5

      - name: Setup Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Diagnostics & Pipeline
        run: |
          python sync_all_live_sarkari.py
          python scrape_incremental.py
          python scrape_schemes.py
          python scrape_state_jobs.py
          python update_market_data.py
          python scripts/sync_youtube_classes.py || true

      - name: Dispatch Broadcast Service
        run: |
          python telegram_poster.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Synchronize State
        id: sync_check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No state updates to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: New recruitment notices, admit cards, and live news [skip ci]"
            git pull --rebase origin main || true
            git push "https://${{ secrets.WORKER_PAT }}@github.com/nikhildswll-sys/bharat-job.git" HEAD:main || true
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Cloud Hosting Artifacts
        if: steps.sync_check.outputs.has_changes == 'true'
        run: npx --yes firebase-tools deploy --only hosting --project rozgarone-98695 --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
